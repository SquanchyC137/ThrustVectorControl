

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

;N16R8
board_build.flash_size = 16MB
board_build.psram_type = octal  ;8 MB Octal PSRAM
board_build.arduino.memory_type = qio_opi  ;PSRAM and flash compability
board_build.flash_mode = qio
board_build.mcu = esp32s3
board_build.f_flash = 80000000L  ;80 MHz Flash
board_build.f_cpu = 240000000L   ;240 MHz CPU
board_build.filesystem = spiffs
board_upload.usb_mode = cdc

upload_protocol = esptool
upload_resetmethod = nodemcu

;debug (optional)
debug_tool = esp-builtin
debug_init_break = tbreak setup


lib_deps = 
  ayushsharma82/ElegantOTA
  adafruit/Adafruit MPU6050
  madhephaestus/ESP32Servo
  bblanchon/ArduinoJson
  esp32async/ESPAsyncWebServer
  esp32async/AsyncTCP